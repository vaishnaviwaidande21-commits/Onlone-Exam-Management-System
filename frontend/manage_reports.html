<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reports</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:#f4f8ff;
}

.container{
    width:90%;
    margin:50px auto;
}

h1{
    text-align:center;
    color:#0f4c81;
    margin-bottom:40px;
}

.cards{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

.card{
    width:230px;
    height:200px;
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    cursor:pointer;
    transition:0.3s;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 30px rgba(0,0,0,0.20);
}

.icon{
    font-size:50px;
    margin-bottom:20px;
}

.card-button{
    display:block;
    width:100%;
    background:#1976d2;
    color:white;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
}

.card:hover .card-button{
    background:#0f4c81;
}

.back{
    display:block;
    width:220px;
    margin:40px auto 0;
    background:#1565c0;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
}

.back:hover{
    background:#0d47a1;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 Reports</h1>

<div class="cards">

<div class="card" onclick="window.location.href='/student_report'">

```
<div class="icon">👨‍🎓</div>

<div class="card-button">
    Student Report
</div>
```

</div>

<div class="card" onclick="window.location.href='/exam_report'">

```
<div class="icon">📝</div>

<div class="card-button">
    Exam Report
</div>
```

</div>

<div class="card" onclick="window.location.href='/question_bank_report'">

```
<div class="icon">📚</div>

<div class="card-button">
    Question Bank
</div>
```

</div>

<div class="card" onclick="window.location.href='/result_report'">

```
<div class="icon">📊</div>

<div class="card-button">
    Result Report
</div>
```

</div>

</div>

<a class="back" href="/admin">

```
⬅ Back To Admin Dashboard
```

</a>

</div>

</body>

</html>
