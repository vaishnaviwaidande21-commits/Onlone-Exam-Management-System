<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<title>View Students</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f8ff;
}

.container{
    width:90%;
    margin:50px auto;
}

h1{
    text-align:center;
    color:#0f4c81;
    margin-bottom:30px;
}

table{
    width:100%;
    background:white;
    border-collapse:collapse;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

th{
    background:#1976d2;
    color:white;
    padding:15px;
}

td{
    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f1f7ff;
}

.back{
    display:inline-block;
    margin-top:30px;
    padding:12px 25px;
    background:#1976d2;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

</style>

</head>

<body>

<div class="container">

<h1>
👨‍🎓 Student List
</h1>

<table>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Year</th>

</tr>

{% for student in students %}

<tr>

<td>
{{ student.student_id }}
</td>

<td>
{{ student.name }}
</td>

<td>
{{ student.email }}
</td>

<td>
{{ student.year }}
</td>

</tr>

{% endfor %}

</table>

<a class="back" href="/manage_students">
⬅ Back To Student Management
</a>

</div>

</body>

</html>
