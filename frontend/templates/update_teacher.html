<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Update Teacher</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f8ff;
}


.container{

    width:450px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);

}


h1{

    text-align:center;
    color:#0f4c81;

}


input{

    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;

}


button{

    width:100%;
    padding:12px;
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#0f4c81;

}


.back{

    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#1976d2;

}


</style>

</head>


<body>


<div class="container">


<h1>
✏ Update Teacher
</h1>



<form method="POST">


<input 
type="number" 
name="teacher_id"
placeholder="Enter Teacher ID"
required>


<input 
type="text"
name="name"
placeholder="Enter New Name">



<input 
type="email"
name="email"
placeholder="Enter New Email">



<input 
type="text"
name="subject"
placeholder="Enter New Subject">



<input 
type="password"
name="password"
placeholder="Enter New Password">



<button type="submit">
Update Teacher
</button>



</form>



<a class="back" href="/manage_teachers">
⬅ Back
</a>


</div>


</body>

</html>
