<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Teacher Login</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#031b4e,#1976d2);

}



.container{

    width:1100px;
    height:620px;
    background:white;
    border-radius:30px;
    display:flex;
    overflow:hidden;
    box-shadow:0 25px 50px rgba(0,0,0,0.35);

}



/* LEFT */

.left{

    width:50%;
    background:linear-gradient(160deg,#0f4c81,#2196f3);
    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

}



.left h1{

    font-size:42px;

}


.left p{

    font-size:18px;
    margin-top:10px;

}



.features{

    margin-top:50px;
    font-size:17px;

}



.features div{

    margin:15px;

}




/* RIGHT */

.right{

    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5faff;

}



.card{

    width:380px;
    padding:40px;
    background:white;
    border-radius:30px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.15);

}



.icon{

    width:90px;
    height:90px;
    margin:auto;

    background:#e3f2fd;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:45px;

}



h2{

    color:#0f4c81;
    margin-top:20px;
    font-size:32px;

}



.card p{

    color:gray;
    margin:15px;

}



input{

    width:100%;
    padding:14px;

    margin:12px 0;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:16px;

}



button{

    width:100%;

    padding:14px;

    margin-top:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#1976d2,#0f4c81);

    color:white;

    font-size:17px;

    cursor:pointer;

}



button:hover{

    transform:translateY(-3px);

}



.back{

    display:block;

    margin-top:20px;

    color:#1976d2;

    text-decoration:none;

}


</style>


</head>


<body>


<div class="container">



<div class="left">


<h1>
📚 Online Exam
</h1>


<p>
Teacher Portal
</p>



<div class="features">

<div>
📝 Create Online Exams
</div>


<div>
🤖 Generate Questions
</div>


<div>
📊 Check Student Results
</div>


</div>



</div>





<div class="right">


<div class="card">


<div class="icon">
👨‍🏫
</div>



<h2>
Teacher Login
</h2>


<p>
Enter your teacher details
</p>




<!-- IMPORTANT: Teacher Login Route -->

<form action="/teacher_login" method="POST">


<input

type="text"

name="username"

placeholder="Teacher Email"

required>



<input

type="password"

name="password"

placeholder="Password"

required>



<button type="submit">

Login

</button>



</form>



<a href="/" class="back">

← Back to Home

</a>



</div>


</div>



</div>


</body>


</html>
