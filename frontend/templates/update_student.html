<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<title>Update Student</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#e3f2fd,#ffffff);
}

.container{
    width:450px;
    margin:50px auto;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#0f4c81;
    margin-bottom:30px;
}

input,select{
    width:100%;
    padding:13px;
    margin:12px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#1976d2;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#009688,#00695c);
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#1976d2;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>
✏️ Update Student
</h1>

<form method="POST" action="{{ url_for('update_student') }}">

<input
type="text"
name="student_id"
placeholder="Student ID"
required>

<input
type="text"
name="name"
placeholder="Student Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<select name="year" required>

<option value="">
Select Year
</option>

<option value="First Year">
First Year
</option>

<option value="Second Year">
Second Year
</option>

<option value="Third Year">
Third Year
</option>

</select>

<button type="submit">
Update Student
</button>

</form>

<a class="back" href="{{ url_for('manage_students') }}">
⬅ Back To Student Management
</a>

</div>

</body>

</html>
