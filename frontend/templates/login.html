<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Online Exam Management System</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(
        135deg,
        #031b4e,
        #1976d2
    );

}



.container{

    width:1100px;
    height:620px;

    background:white;

    border-radius:30px;

    display:flex;

    overflow:hidden;

    box-shadow:
    0 25px 50px rgba(0,0,0,0.35);

}



/* LEFT SIDE */


.left{

    width:50%;

    background:
    linear-gradient(
        160deg,
        #0f4c81,
        #2196f3
    );

    color:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    position:relative;

    overflow:hidden;

}



.left::before{

    content:"";

    position:absolute;

    width:350px;

    height:350px;

    background:
    rgba(255,255,255,0.12);

    border-radius:50%;

    top:-150px;

    left:-150px;

}



.left h1{

    font-size:42px;

    z-index:1;

}



.left p{

    font-size:18px;

    margin-top:10px;

    z-index:1;

}




/* BOOK DESIGN */


.books{

    display:flex;

    align-items:flex-end;

    gap:15px;

    margin-top:45px;

    z-index:1;

}



.book{

    width:65px;

    height:180px;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #dbeafe
    );

    border-radius:8px;

    border-left:8px solid #1565c0;

    box-shadow:

    8px 10px 20px rgba(0,0,0,0.35);

    position:relative;

}



.book::before{

    content:"📖";

    position:absolute;

    top:25px;

    left:15px;

    font-size:28px;

}



.book::after{

    content:"";

    position:absolute;

    left:15px;

    right:15px;

    bottom:30px;

    height:5px;

    background:#1976d2;

    border-radius:5px;

}



.book:nth-child(2){

    height:250px;

}



.book:nth-child(3){

    height:150px;

}



.book:nth-child(4){

    height:210px;

}




.features{

    margin-top:40px;

    z-index:1;

    font-size:17px;

}



.features div{

    margin:12px;

}





/* RIGHT SIDE */


.right{

    width:50%;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(
        135deg,
        #ffffff,
        #eef6ff
    );

}



.card{

    width:380px;

    padding:40px;

    background:white;

    border-radius:30px;

    text-align:center;

    box-shadow:

    0 20px 40px rgba(0,0,0,0.15);

}



.icon{

    width:90px;

    height:90px;

    margin:auto;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#e3f2fd;

    border-radius:50%;

    font-size:45px;

}



.card h2{

    color:#0f4c81;

    margin-top:20px;

    font-size:34px;

}



.card p{

    color:gray;

    margin:15px;

}




.small-icons{

    display:flex;

    justify-content:center;

    gap:15px;

    margin:20px;

}



.small-icons span{

    background:#e3f2fd;

    padding:12px;

    border-radius:50%;

    font-size:22px;

}





.btn{

    display:block;

    padding:16px;

    margin:18px 0;

    background:

    linear-gradient(
        135deg,
        #1976d2,
        #0f4c81
    );


    color:white;

    text-decoration:none;

    border-radius:15px;

    font-size:18px;

    box-shadow:

    0 8px 15px rgba(25,118,210,0.3);

    transition:.3s;

}



.btn:hover{

    transform:translateY(-5px);

    box-shadow:

    0 15px 25px rgba(25,118,210,0.4);

}



</style>

</head>



<body>


<div class="container">


<div class="left">


<h1>📚 Online Exam</h1>

<p>Smart Examination Management System</p>



<div class="books">

<div class="book"></div>

<div class="book"></div>

<div class="book"></div>

<div class="book"></div>

</div>




<div class="features">

<div>🔒 Secure Online Examination</div>

<div>🤖 AI Question Management</div>

<div>📊 Instant Result Analysis</div>

</div>



</div>






<div class="right">


<div class="card">


<div class="icon">
🎓
</div>


<h2>Welcome</h2>

<p>Select Your Login Portal</p>



<div class="small-icons">

<span>📝</span>

<span>📚</span>

<span>🔐</span>

<span>📊</span>

</div>



<a href="/admin_login" class="btn">
👨‍💼 Admin Login
</a>


<a href="/teacher_login" class="btn">
👨‍🏫 Teacher Login
</a>


<a href="/student_login" class="btn">
👨‍🎓 Student Login
</a>



</div>


</div>


</div>


</body>

</html>
