<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Manage Questions</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    background:linear-gradient(135deg,#eef5ff,#ffffff);

}



.container{

    width:850px;

    margin:50px auto;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 15px 35px rgba(0,0,0,0.15);

}



h1{

    text-align:center;

    color:#1565c0;

    margin-bottom:30px;

}



.top-icon{

    text-align:center;

    font-size:60px;

}



.cards{

    display:flex;

    justify-content:center;

    gap:25px;

    margin-top:35px;

}



.card{

    width:220px;

    padding:30px;

    background:#f5faff;

    border-radius:20px;

    text-align:center;

    box-shadow:0 8px 20px rgba(0,0,0,0.1);

}



.card i{

    font-size:40px;

    color:#1976d2;

}



.card h3{

    margin-top:15px;

    color:#0f4c81;

}



button{

    margin-top:30px;

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#2196f3,#673ab7);

    color:white;

    font-size:17px;

}



.back{

    display:block;

    text-align:center;

    margin-top:25px;

    color:#1565c0;

    text-decoration:none;

    font-weight:bold;

}



</style>

</head>



<body>


<div class="container">


<div class="top-icon">
❓
</div>


<h1>
Manage Questions
</h1>



<div class="cards">


<div class="card">

<div>
➕
</div>

<h3>
Add Question
</h3>

</div>



<div class="card">

<div>
👁️
</div>

<h3>
View Questions
</h3>

</div>




<div class="card">

<div>
🗑️
</div>

<h3>
Delete Questions
</h3>

</div>



</div>



<button>

Open Question Bank

</button>



<a href="/teacher" class="back">

⬅ Back To Dashboard

</a>



</div>


</body>

</html>
