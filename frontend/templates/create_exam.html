<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<title>Create New Exam</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#e3f2fd,#ffffff);
}

.container{
    width:500px;
    margin:40px auto;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#0f4c81;
    margin-bottom:30px;
}

label{
    display:block;
    margin-top:12px;
    color:#0f4c81;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:16px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#1976d2;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#1976d2,#0f4c81);
    color:white;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.back{
    display:block;
    text-align:center;
    margin-top:25px;
    color:#1976d2;
    text-decoration:none;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>➕ Create New Exam</h1>

<form method="POST">

<label>Exam Name</label>

<input
type="text"
name="exam_name"
placeholder="Exam Name"
required>

<label>Subject Name</label>

<input
type="text"
name="subject"
placeholder="Subject Name"
required>

<label>Question Type</label>

<select
name="question_type"
required>

<option value="">
Select Question Type
</option>

<option value="MCQ">
MCQ
</option>

<option value="True/False">
True / False
</option>

<option value="Fill in the Blanks">
Fill in the Blanks
</option>

</select>

<label>Number of Questions</label>

<select
name="number_of_questions"
id="number_of_questions"
required
onchange="calculateMarks()">

<option value="">
Select Number of Questions
</option>

<option value="10">10 Questions</option>
<option value="20">20 Questions</option>
<option value="30">30 Questions</option>
<option value="40">40 Questions</option>
<option value="50">50 Questions</option>
<option value="60">60 Questions</option>
<option value="70">70 Questions</option>
<option value="80">80 Questions</option>
<option value="90">90 Questions</option>
<option value="100">100 Questions</option>

</select>

<label>Duration</label>

<select
name="duration"
required>

<option value="">
Select Duration
</option>

<option value="10">10 Minutes</option>
<option value="20">20 Minutes</option>
<option value="30">30 Minutes</option>
<option value="40">40 Minutes</option>
<option value="50">50 Minutes</option>
<option value="60">60 Minutes</option>

</select>

<label>Total Marks</label>

<input
type="number"
name="total_marks"
id="total_marks"
placeholder="Total Marks"
readonly
required>

<button type="submit">
Create New Exam
</button>

</form>

<a
class="back"
href="/teacher">

⬅ Back To Teacher Dashboard

</a>

</div>

<script>

function calculateMarks(){

    let questions =
        document.getElementById("number_of_questions").value;

    let marks =
        document.getElementById("total_marks");

    if(questions){

        marks.value = questions;

    }
    else{

        marks.value = "";

    }

}

</script>

</body>

</html>
