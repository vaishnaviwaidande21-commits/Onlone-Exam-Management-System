<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>View Teachers</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#f4f8ff;
}


.container{

    width:90%;
    margin:40px auto;

}


h1{

    color:#0f4c81;
    text-align:center;

}


table{

    width:100%;
    background:white;
    border-collapse:collapse;
    margin-top:30px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);

}


th{

    background:#0f4c81;
    color:white;
    padding:15px;

}


td{

    padding:15px;
    text-align:center;
    border-bottom:1px solid #ddd;

}


tr:hover{

    background:#f1f7ff;

}


.back{

    display:inline-block;
    margin-top:20px;
    padding:12px 20px;
    background:#1976d2;
    color:white;
    text-decoration:none;
    border-radius:8px;

}


</style>

</head>


<body>


<div class="container">


<h1>👨‍🏫 Manage Teachers</h1>



<table>


<tr>

<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Subject</th>

</tr>



{% for teacher in teachers %}

<tr>

<td>{{teacher.teacher_id}}</td>

<td>{{teacher.name}}</td>

<td>{{teacher.email}}</td>

<td>{{teacher.subject}}</td>

</tr>


{% endfor %}



</table>



<a class="back" href="/admin">
⬅ Back to Dashboard
</a>



</div>


</body>

</html>
