<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Result Report</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:#f4f8ff;
}

.container{
    width:90%;
    margin:50px auto;
}

h1{
    text-align:center;
    color:#0f4c81;
    margin-bottom:40px;
}

.report-box{
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    text-align:center;
}

.report-box p{
    color:#555;
    font-size:18px;
}

.back{
    display:block;
    width:220px;
    margin:40px auto 0;
    background:#1565c0;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
}

.back:hover{
    background:#0d47a1;
}

</style>

</head>

<body>

<div class="container">

<h1>📊 Result Report</h1>

<div class="report-box">

<p>
Result Report will be displayed here.
</p>

</div>

<a class="back" href="/manage_reports">

⬅ Back To Reports

</a>

</div>

</body>

</html>
