<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Report</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    background:#f4f8ff;
}

.container{
    width:90%;
    margin:40px auto;
}

h1{
    text-align:center;
    color:#0f4c81;
    margin-bottom:30px;
}

.report-box{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#1976d2;
    color:white;
    padding:14px;
    text-align:center;
}

td{
    padding:12px;
    text-align:center;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f1f7ff;
}

.no-data{
    text-align:center;
    color:#777;
    padding:25px;
    font-size:18px;
}

.back{
    display:block;
    width:220px;
    margin:30px auto 0;
    background:#1565c0;
    color:white;
    padding:12px 25px;
    border-radius:10px;
    text-decoration:none;
    text-align:center;
    font-weight:bold;
}

.back:hover{
    background:#0d47a1;
}

</style>

</head>

<body>

<div class="container">

<h1>👨‍🎓 Student Report</h1>

<div class="report-box">

{% if students %}

<table>

<thead>

<tr>

<th>Student ID</th>
<th>Name</th>
<th>Email</th>
<th>Year</th>

</tr>

</thead>

<tbody>

{% for student in students %}

<tr>

<td>{{ student[0] }}</td>
<td>{{ student[1] }}</td>
<td>{{ student[2] }}</td>
<td>{{ student[4] }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% else %}

<div class="no-data">

No students found.

</div>

{% endif %}

</div>

<a class="back" href="/manage_reports">

⬅ Back To Reports

</a>

</div>

</body>

</html>
