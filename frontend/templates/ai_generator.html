<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>AI Question Generator</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    background:linear-gradient(135deg,#eef5ff,#ffffff);

}



.container{

    width:750px;

    margin:50px auto;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 15px 35px rgba(0,0,0,0.15);

}



.icon{

    text-align:center;

    font-size:70px;

}



h1{

    text-align:center;

    color:#673ab7;

    margin:20px;

}



p{

    text-align:center;

    color:gray;

    margin-bottom:25px;

}



input,select{

    width:100%;

    padding:14px;

    margin:12px 0;

    border-radius:12px;

    border:1px solid #ccc;

    font-size:16px;

}



button{

    width:100%;

    padding:15px;

    margin-top:20px;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#9c27b0,#673ab7);

    color:white;

    font-size:18px;

}



.features{

    margin-top:30px;

    display:flex;

    justify-content:space-around;

}



.feature{

    text-align:center;

    color:#673ab7;

}



.feature div{

    font-size:35px;

}



.back{

    display:block;

    text-align:center;

    margin-top:25px;

    color:#673ab7;

    text-decoration:none;

    font-weight:bold;

}


</style>


</head>


<body>


<div class="container">


<div class="icon">

🤖

</div>


<h1>
AI Question Generator
</h1>


<p>
Generate smart questions automatically for exams
</p>



<form>


<input

type="text"

placeholder="Enter Subject (Python, Java, DBMS...)">



<input

type="text"

placeholder="Enter Topic">



<select>

<option>Select Difficulty</option>

<option>Easy</option>

<option>Medium</option>

<option>Hard</option>

</select>



<input

type="number"

placeholder="Number of Questions">



<select>

<option>Select Question Type</option>

<option>MCQ</option>

<option>True / False</option>

<option>Fill in the Blank</option>

</select>



<button>

🤖 Generate Questions

</button>



</form>





<div class="features">


<div class="feature">

<div>
⚡
</div>

Fast Generation

</div>



<div class="feature">

<div>
🧠
</div>

Smart AI

</div>



<div class="feature">

<div>
📚
</div>

Question Bank

</div>



</div>





<a href="/teacher" class="back">

⬅ Back To Dashboard

</a>



</div>


</body>

</html>
